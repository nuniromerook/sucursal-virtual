map $http_user_agent $is_bot {
    default 0;
    "~*googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|whatsapp|telegrambot" 1;
}

# 1. TIENDA CLIENTE (PWA ECOMMERCE)
server {
    server_name abastecedoravalette.digital www.abastecedoravalette.digital;
    root /var/www/sucursal-virtual/frontend-client/dist;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;

    # Sitemap XML generado dinámicamente desde el backend
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Robots.txt servido directamente
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    # Soporte para React Router (SPA) y Dynamic Rendering para Bots
    location / {
        error_page 418 = @bot_handler;
        if ($is_bot = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @bot_handler {
        proxy_pass http://127.0.0.1:3000/api/seo/render?path=$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché de archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/abastecedoravalette.digital/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/abastecedoravalette.digital/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. PANEL ADMINISTRATIVO & COMANDAS TV (KDS)
server {
    server_name admin.abastecedoravalette.digital;
    root /var/www/sucursal-virtual/frontend-admin/dist;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/abastecedoravalette.digital/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/abastecedoravalette.digital/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 3. BACKEND API REST & WEBSOCKETS (SOCKET.IO)
server {
    server_name api.abastecedoravalette.digital;

    client_max_body_size 50M;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Soporte para WebSockets en tiempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/abastecedoravalette.digital/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/abastecedoravalette.digital/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.abastecedoravalette.digital) {
        return 301 https://$host$request_uri;
    }

    if ($host = abastecedoravalette.digital) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name abastecedoravalette.digital www.abastecedoravalette.digital;
    return 404;
}

server {
    if ($host = admin.abastecedoravalette.digital) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name admin.abastecedoravalette.digital;
    return 404;
}

server {
    if ($host = api.abastecedoravalette.digital) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.abastecedoravalette.digital;
    return 404;
}
